<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水泳練習メニュー</title>
  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').then(function(registration) {
          console.log('ServiceWorker registration successful');
        }, function(err) {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</head>
<body>

  <div class="no-print button-bar" style="margin-bottom: 15px;">
    <div>
      <button onclick="undo()" style="padding: 4px 10px; cursor: pointer; font-weight: bold;">⬅ 戻る</button>
      <button onclick="redo()" style="padding: 4px 10px; cursor: pointer; font-weight: bold; margin-left: 5px;">やり直す ➡</button>
    </div>
    <div>
      <button id="saveBtn" style="padding: 4px 10px; cursor: pointer; font-weight: bold;">ファイル保存(.json)</button>
      <button id="pdfBtn" style="padding: 4px 10px; cursor: pointer; font-weight: bold; background: #d32f2f; color: white; margin-left: 5px;">PDFダウンロード</button>
      <span style="margin-left: 15px; font-size: 11px;">読込:</span>
      <input type="file" id="loadBtn" accept=".json">
    </div>
  </div>

  <div class="print-container">
    
    <div class="header-info">
      <h2 style="margin: 0; font-size: 13px;">University of Tokyo Swimming Team Training Menu</h2>
      <div class="meta-inputs">
        <input type="date" id="menuDate">
        <select id="menuAmPm"><option value="AM">AM</option><option value="PM">PM</option></select>
        <select id="menuType"><option value="Short">Short</option><option value="Middle">Middle</option><option value="Long">Long</option></select>
        <span>作成:</span>
        <input type="text" id="menuAuthor" placeholder="名前" style="width: 60px; text-align: center;">
      </div>
    </div>

    <datalist id="work-options">
      <option value="W-up"></option><option value="Swim"></option><option value="Pull"></option>
      <option value="Kick"></option><option value="Drill"></option><option value="Down"></option>
      <option value="Easy"></option><option value="Rest"></option>
    </datalist>
    <datalist id="dis-options">
      <option value="25"></option><option value="50"></option><option value="75"></option><option value="100"></option>
      <option value="150"></option><option value="200"></option><option value="300"></option><option value="400"></option>
    </datalist>
    <datalist id="sys-options">
      <option value="A1"></option><option value="EN1"></option><option value="EN2"></option><option value="EN3"></option>
      <option value="AN1"></option><option value="AN2"></option><option value="AN3"></option><option value="Max"></option>
    </datalist>
    <datalist id="str-options">
      <option value="IM"></option><option value="cho"></option><option value="S1"></option><option value="Fr"></option>
    </datalist>
    <datalist id="repset-options">
      <option value="1"></option><option value="2"></option><option value="3"></option><option value="4"></option>
      <option value="5"></option><option value="6"></option><option value="7"></option><option value="8"></option><option value="9"></option><option value="10"></option>
    </datalist>

    <table>
      <thead>
        <tr>
          <th class="delete-col no-print"></th>
          <th>Time</th>
          <th>work</th><th>dis</th><th>rep</th><th>set</th><th>interval</th><th>note</th><th>sys</th><th>str</th><th>Item</th><th>MG</th><th>set rest</th>
        </tr>
      </thead>
      <tbody>
        <!-- app.jsが生成 -->
      </tbody>
    </table>

    <div class="no-print" style="margin-top: 10px; text-align: center;">
      <button id="addRowBtn" style="padding: 6px 20px; border-radius: 20px; cursor: pointer; border: 1px solid #ccc;">＋ 行を追加</button>
    </div>

    <div class="bottom-section">
      <div class="memo-box">
        <textarea id="menuMemo" rows="1" oninput="this.style.height='0px'; this.style.height=this.scrollHeight+'px';" placeholder="メニューの説明や意図をここに記入..."></textarea>
      </div>
      
      <div class="chart-box">
        <div style="font-size: 11px; font-weight: bold; margin-bottom: 2px;" id="totalDistanceDisplay">Total: 0 m</div>
        <div class="pie-chart" id="sysPieChart"></div>
        <div class="chart-legend" id="sysLegend"></div>
      </div>

      <div class="countdown-box">
        <div class="countdown-item"><input type="text" id="event1Name" value="東部" placeholder="大会名"><input type="date" id="event1Date" value="2026-06-27"><div id="event1Days" class="days-left">あと -- 日</div></div>
        <div class="countdown-item"><input type="text" id="event2Name" value="全国公" placeholder="大会名"><input type="date" id="event2Date" value="2026-08-06"><div id="event2Days" class="days-left">あと -- 日</div></div>
        <div class="countdown-item"><input type="text" id="event3Name" value="インカレ" placeholder="大会名"><input type="date" id="event3Date" value="2026-09-03"><div id="event3Days" class="days-left">あと -- 日</div></div>
      </div>
    </div>
  </div>

  <div id="varModal" class="no-print" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:white; padding:20px; border:2px solid #000; z-index:1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border-radius: 8px;">
    <h3 style="margin-top:0;">変則サークル設定</h3>
    <div id="varModalInputs" style="display:flex; flex-direction:column; gap:5px; max-height:300px; overflow-y:auto; padding-right:10px;"></div>
    <div style="margin-top:15px; text-align:right;">
      <button onclick="closeVarModal()" style="padding: 5px 10px;">キャンセル</button>
      <button onclick="saveVarModal()" style="background:#0078d7; color:white; padding: 5px 15px; margin-left: 10px; font-weight:bold;">決定</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
